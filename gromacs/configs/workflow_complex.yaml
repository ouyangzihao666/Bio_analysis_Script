name: complex-md
failure_policy: continue
layout: per_step
mdp_dir: mdp

steps:
  - step: env_check
    params:
      tools: [obabel, antechamber, parmchk2, acpype, pymol]
  - step: split_complex
    params:
      on_failure: pause
  # 配体分离默认用确定性解析器；如改用 PyMOL 拆分，把下面步骤换成 pymol_split_ligand
  - step: split_ligand
    params:
      on_failure: pause
  - step: protein_prep
    params:
      force_field: amber99sb-ildn
      water_model: tip3p
  - step: ligand_prep
    params:
      ligand_force_field: gaff2
      charge_method: bcc
  - step: complex_merge
  - step: box
    params:
      box_type: dodecahedron
      box_distance: 1.0
  - step: solvate
  - step: ions
    params:
      positive_ion: NA
      negative_ion: CL
      concentration: 0.1
  - step: em
    params:
      verbose: true
  - step: nvt
    params:
      verbose: true
  - step: npt
    params:
      verbose: true
  - step: md
    params:
      verbose: true
  - step: index
  - step: traj_correct
    params:
      method: pbc_mol
      center_group: Protein
      output_group: System
