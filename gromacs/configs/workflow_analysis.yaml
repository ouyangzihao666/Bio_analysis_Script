name: analysis
failure_policy: continue
layout: per_step

# 解析已有 run 输出目录的约定；如你的生产目录名不同，改这里
dirs:
  md_production: "*_md"

steps:
  - step: rmsd
    params:
      fit_group: C-alpha
      cal_group: C-alpha
  - step: rmsf
    params:
      cal_group: Protein
  - step: gyrate
    params:
      cal_group: Protein
  - step: hbond
    params:
      ref_group: Protein
      target_group: Ligand
  - step: dssp
    params:
      cal_group: Protein
  - step: outpdb
    params:
      out_group: System
